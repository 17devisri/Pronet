name: Build and Deploy Pronet to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'pronet-api-cb'
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Frontend Dependencies & Build
        run: |
          npm ci || npm install
          npm run build
        env:
          VITE_API_URL: 'https://pronet-api-cb.azurewebsites.net'

      - name: 📁 Copy Frontend Build to Django Package
        run: |
          mkdir -p django_backend/dist
          cp -r dist/* django_backend/dist/

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: django_backend/requirements.txt

      - name: 📦 Install Python Dependencies & Verify Django
        run: |
          python -m pip install --upgrade pip
          pip install -r django_backend/requirements.txt
          python django_backend/manage.py check
          # Remove local SQLite db generated on runner so it is NEVER packaged into deployment bundle
          rm -f django_backend/db.sqlite3

      - name: 🗜️ Package Deployment Bundle
        run: |
          cd django_backend
          # Exclude SQLite files, virtualenvs, and caches so live persistent data on Azure is NEVER overwritten
          zip -r ../deploy-package.zip . -x "*__pycache__*" "*.pyc" "*venv*" "*.sqlite3*" "*db.sqlite3*"

      - name: 🚀 Deploy to Azure Web App
        run: |
          echo "Initiating ZipDeploy to pronet-api-cb.scm.azurewebsites.net..."
          HTTP_STATUS=$(curl -s -w "%{http_code}" -o deploy_response.log -X POST \
            -u "pronet_cb_2026_dev:${{ secrets.AZURE_DEPLOY_PASSWORD || 'Pronet@SuperSecure2026!' }}" \
            --data-binary "@deploy-package.zip" \
            https://pronet-api-cb.scm.azurewebsites.net/api/zipdeploy)

          echo "Deployment HTTP status code: $HTTP_STATUS"
          cat deploy_response.log

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Deployment completed successfully!"
          else
            echo "❌ Deployment failed with HTTP $HTTP_STATUS"
            exit 1
          fi
